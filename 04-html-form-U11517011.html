<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放學後社團體驗表</title>
  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 15px;
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    fieldset {
      margin-bottom: 15px;
      border: 1px solid #ccc;
      padding: 10px 15px;
      border-radius: 6px;
    }
    legend {
      font-weight: bold;
      padding: 0 5px;
    }
    .explanation {
      font-size: 0.9em;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- 返回數位科技概論作業頁面的連結 -->
  <a href="digital-tech.html" class="back-link">← 返回數位科技概論作業</a>

  <h1>放學後社團體驗表</h1>
  <p>這是介面練習，資料不會送出或保存，不能當成正式報名。</p>

  <!-- 1. 暱稱 (單行文字) -->
  <p>
    <label for="nickname">我的暱稱</label><br>
    <input id="nickname" name="nickname" type="text" placeholder="例如：小星星">
  </p>

  <!-- 2. 想體驗的社團 (下拉選單) -->
  <p>
    <label for="club">想體驗的社團</label><br>
    <select id="club" name="club">
      <option value="">請選擇社團</option>
      <option value="story">故事劇場</option>
      <option value="science">科學手作</option>
      <option value="boardgame">桌遊挑戰</option>
    </select>
  </p>

  <!-- 3. 方便參加的日子 (單選按鈕) -->
  <fieldset>
    <legend>方便參加的日子</legend>
    <p><label><input type="radio" name="day" value="tuesday"> 星期二</label></p>
    <p><label><input type="radio" name="day" value="thursday"> 星期四</label></p>
    <p><label><input type="radio" name="day" value="friday"> 星期五</label></p>
  </fieldset>

  <!-- 4. 我期待的活動方式 (複選方塊) -->
  <fieldset>
    <legend>我期待的活動方式</legend>
    <p><label><input type="checkbox" name="activity_style" value="hands_on"> 動手製作</label></p>
    <p><label><input type="checkbox" name="activity_style" value="cooperation"> 和同學合作</label></p>
    <p><label><input type="checkbox" name="activity_style" value="presentation"> 上台分享</label></p>
  </fieldset>

  <!-- 5. 自訂新增欄位 (需求 7) -->
  <p>
    <label for="diet">特殊飲食需求（自訂新增欄位）</label><br>
    <select id="diet" name="diet">
      <option value="none">無特殊需求</option>
      <option value="vegetarian">素食</option>
      <option value="allergy">食物過敏（請於下方備註說明）</option>
    </select>
  </p>
  <p class="explanation">
    💡 設計說明：新增「特殊飲食需求」下拉選單，以便社團點心時間能提前準備適合學生的餐點。
  </p>

  <!-- 6. 想告訴老師的事 (五行高 textarea) -->
  <p>
    <label for="message">想告訴老師的事</label><br>
    <textarea id="message" name="message" rows="5" cols="35" placeholder="例如：我想和同學一起完成一個小作品"></textarea>
  </p>

  <!-- 7. 停用按鈕 (需求 9) -->
  <button type="button" disabled>練習版，尚未開放報名</button>

  <p>這個按鈕刻意停用。HTML 可以提供輸入與選擇介面，但這份練習沒有接上處理或儲存資料的功能。</p>

</body>
</html>
